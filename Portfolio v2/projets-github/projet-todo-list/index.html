<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>Ma ToDo List</title>
        <meta name="description" content="Une liste de tâches simple avec sauvegarde locale" />
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script> 
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>


    <div class ="main">
        <div class="conteneur">
            <h1>Ma to-do-list</h1>
            <div class ="champs">
                <input type="text" id ="TaskInput" placeholder="Ajouter un tâche">
                <button onclick="addTask()"><ion-icon name="add-circle-outline"></ion-icon></button>
            </div>

            <ul id="taskList"></ul>

        </div>
    </div>
    <script src="script.js" defer></script>

</html>
