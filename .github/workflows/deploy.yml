name: Deploy Portfolio to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v6

      - name: Verification du portfolio
        run: test -f index.html

      - name: Deploiement SFTP automatique sur OVH
        uses: eiserv/easySFTP@v3.8.6
        with:
          host: ${{ secrets.OVH_HOST }}
          port: 22
          username: ${{ secrets.OVH_USERNAME }}
          password: ${{ secrets.OVH_PASSWORD }}
          host-key: ${{ secrets.OVH_SFTP_HOST_KEY }}
          source: .
          target: ./www/
          mode: overlay
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            **/node_modules/
            **/node_modules/**
            **/.env*
            **/.vscode/
            **/.vscode/**
            **/README.md
